name: Build CyberFoil (background-backend)

on:
  push:
    branches:
      - background-backend
  pull_request:
    branches:
      - background-backend

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Switch dependencies
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -S --noconfirm --needed switch-ntfs-3g switch-lwext4

      - name: Build CyberFoil NRO
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -s ./cyberfoil.nro
          ls -lh ./cyberfoil.nro

      - name: Build CyberFoil backend sysmodule
        shell: bash
        run: |
          set -euo pipefail
          make -C sysmodule -j"$(nproc)"
          test -s ./sysmodule/cyberfoil-backend.nsp
          ls -lh ./sysmodule/cyberfoil-backend.nsp

      - name: Package emuMMC-only backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/switch/CyberFoil
          mkdir -p dist/atmosphere/contents/420000000000CF01/flags
          cp ./cyberfoil.nro dist/switch/CyberFoil/cyberfoil.nro
          cp ./sysmodule/cyberfoil-backend.nsp dist/atmosphere/contents/420000000000CF01/exefs.nsp
          cp ./sysmodule/toolbox.json dist/atmosphere/contents/420000000000CF01/toolbox.json
          touch dist/atmosphere/contents/420000000000CF01/flags/boot2.flag
          printf '%s\n' 'CyberFoil background backend: emuMMC only' > dist/atmosphere/contents/420000000000CF01/README.txt
          cd dist
          zip -r -X ../cyberfoil-background-test.zip .
          cd ..
          ls -lh cyberfoil-background-test.zip

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: cyberfoil-background-test-package
          path: ./cyberfoil-background-test.zip
          if-no-files-found: error
